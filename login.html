<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santos Tech Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
}

.card{
width:400px;
max-width:95%;
background:#0f172a;
padding:35px;
border-radius:18px;
box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#38bdf8;
margin-bottom:8px;
}

.subtitle{
text-align:center;
opacity:.8;
margin-bottom:30px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
}

input:focus{
outline:2px solid #38bdf8;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#38bdf8;
color:#000;
font-weight:bold;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

.links{
margin-top:20px;
text-align:center;
}

.links a{
display:block;
margin-top:10px;
color:#38bdf8;
text-decoration:none;
}

#error{
margin-top:15px;
text-align:center;
color:#ff6b6b;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">
Santos Tech
</div>

<div class="subtitle">
Official Member Login
</div>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<div id="error"></div>

<div class="links">

<a href="#">
Forgot Password</a>

<a href="request-access.html">
Request Access
</a>

</div>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
