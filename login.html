<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santos Tech | Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#020617);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.login-box{
width:400px;
max-width:95%;
background:#111827;
padding:35px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#38bdf8;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:30px;
}

input{
width:100%;
padding:14px;
margin-bottom:18px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:15px;
}

input:focus{
outline:2px solid #38bdf8;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#38bdf8;
color:#000;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0ea5e9;
}

.links{
margin-top:20px;
text-align:center;
}

.links a{
display:block;
margin-top:10px;
color:#38bdf8;
text-decoration:none;
}

.links a:hover{
text-decoration:underline;
}

#error{
margin-top:20px;
text-align:center;
color:#ff6b6b;
font-weight:bold;
}
</style>

</head>

<body>

<div class="login-box">

<div class="logo">
Santos Tech
</div>

<div class="subtitle">
Official Member Login
</div>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<button id="loginBtn">
Login
</button>

<div id="error"></div>

<div class="links">

<a href="#">Forgot Password?</a>

<a href="request-access.html">
Request Access
</a>

</div>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
